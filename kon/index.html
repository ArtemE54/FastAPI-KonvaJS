<!DOCTYPE html>
<head>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body>
    <button id="sButton"> сохранить на сервер</button>
    <button id="lButton"> загрузить с сервера</button>
    <button id="cButton"> очистить сцену</button>
    <div id="container"></div>
    <script>
        let stage = new Konva.Stage({
            container: 'container',
            width: 800,
            height: 500
        });
        const layer = new Konva.Layer();
        stage.add(layer);

        const rect = new Konva.Rect({
            x: 100, y: 80, width: 160, height: 90,
            fill: '#0d21ac', stroke: '#00695c', strokeWidth: 2,
            draggable: true
        });
        const text = new Konva.Text({
            x: 120, y: 110, text: 'Резистор',
            fontSize: 16, fill: '#004d40', draggable: true
        });
        layer.add(rect, text);
        layer.draw();

        document.getElementById('sButton').onclick = async function() {
            const savescene = stage.toJSON();
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: savescene
                })};

        document.getElementById('lButton').onclick = async function() {

            const response = await fetch('/api/load');
            if (!response.ok) {
                    return;
            }
            const sceneData = await response.json();
            stage.destroy();
            stage = Konva.Node.create(sceneData, 'container');
                };

        document.getElementById('cButton').onclick = function() {
            stage.destroyChildren();
            stage.add(new Konva.Layer());
            stage.draw();
        };
    </script>
</body>
</html>
